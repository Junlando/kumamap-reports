<style>

<script>
// ====== 可修改的設定 ======
const AREA = "關西";                                         // 地區名稱（標題、分享文字都會用到）
const SLUG = "kansai";                                       // 英文代號（檔名、存檔用）
const SHARE_URL = "https://junlando.com/threads/japan/" + SLUG + ".html";  // 上線後的網址，分享時一起附上
const STORE_KEY = "bingo-" + SLUG + "-v1";
const ENTRY_TAG = AREA + "入口";                             // 正中間免費格上方的小標籤
const REGIONS = { "大阪": "#f28c28", "京都": "#8e5cc4", "奈良": "#3fa45b", "兵庫": "#2f80d8", "和歌山": "#d9435a", "滋賀": "#1ba39c" };
// 25 格，由左到右、由上到下；第 13 格（正中間）是免費格
// 第三個數字是分數：熱門景點 10 分、要多花點時間的 20 分、比較遠或冷門的 30 分
const SPOTS = [
  ["伏見稻荷", "京都", 10], ["道頓堀", "大阪", 10], ["姬路城", "兵庫", 20], ["錦市場", "京都", 10], ["奈良餵鹿", "奈良", 10],
  ["海遊館", "大阪", 20], ["金閣寺", "京都", 10], ["有馬溫泉", "兵庫", 20], ["大阪城", "大阪", 10], ["宇治\n平等院", "京都", 20],
  ["嵐山竹林", "京都", 10], ["東大寺\n大佛", "奈良", 10], ["關西機場\n落地", "FREE", 0], ["通天閣", "大阪", 10], ["北野\n異人館", "兵庫", 20],
  ["高野山", "和歌山", 30], ["環球影城", "大阪", 10], ["銀閣寺", "京都", 20], ["神戶港", "兵庫", 20], ["清水寺", "京都", 10],
  ["梅田\n藍天大廈", "大阪", 20], ["琵琶湖", "滋賀", 30], ["黑門市場", "大阪", 10], ["花見小路", "京都", 10], ["天橋立", "京都", 30],
];
const FREE = 12;
const LINE_BONUS = 50;   // 每連成一條線加分
const FULL_BONUS = 200;  // 24 個景點全部去過再加分

// 12 條線：5 橫、5 直、2 斜
const LINES = [];
for (let r = 0; r < 5; r++) LINES.push([0, 1, 2, 3, 4].map((c) => r * 5 + c));
for (let c = 0; c < 5; c++) LINES.push([0, 1, 2, 3, 4].map((r) => r * 5 + c));
LINES.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]);

let marked = new Set([FREE]);
try { (JSON.parse(localStorage.getItem(STORE_KEY)) || []).forEach((i) => marked.add(i)); } catch {}

const CIRCLE_SVG = '<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="45" ry="41" fill="none" stroke="#d9435a" stroke-width="5" stroke-linecap="round" stroke-dasharray="270 20"/></svg>';

function render() {
  const g = document.getElementById("grid");
  g.innerHTML = "";
  SPOTS.forEach(([name, region, pts], i) => {
    const c = document.createElement("div");
    c.className = "cell" + (i === FREE ? " free" : "") + (marked.has(i) && i !== FREE ? " on" : "");
    const tag = i === FREE ? `<span class="tag">${ENTRY_TAG}</span>` : "";
    const pill = i === FREE ? "" : `<span class="tag" style="background:${REGIONS[region]}">${region}</span>`;
    const score = i === FREE ? "" : `<span class="pts">${pts}分</span>`;
    c.innerHTML = `${score}${tag}<div>${name}</div>${pill}${i === FREE ? "" : CIRCLE_SVG}`;
    if (i !== FREE) c.onclick = () => toggle(i);
    g.append(c);
  });
  document.getElementById("legend").innerHTML = Object.entries(REGIONS).map(([n, col]) => `<span><i style="background:${col}"></i>${n}</span>`).join("");
  updateResult(false);
}

const bingoLines = () => LINES.filter((l) => l.every((i) => marked.has(i)));
const visitedCount = () => marked.size - 1;
let lastLines = bingoLines().length;

// ====== 數據紀錄（GA4）：填了 GA_ID 才會送，沒填就完全不送 ======
const GA_ID = "";  // 填 GA4 網站串流的評估 ID，例如 "G-ABC123XYZ"
if (GA_ID) {
  const s = document.createElement("script");
  s.async = true; s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
  document.head.append(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag("js", new Date());
  gtag("config", GA_ID);
}
function track(name, params = {}) { if (window.gtag) gtag("event", name, { area: SLUG, ...params }); }
// 一次玩的結果：分數、去過幾個、連幾條、稱號、圈了哪幾格（格子編號 0～24，用 . 隔開）
function resultParams() {
  const sc = scoreOf();
  return { score: sc.total, visited: visitedCount(), lines: bingoLines().length, level: currentLevel().title,
    spots: [...marked].filter((i) => i !== FREE).sort((a, b) => a - b).join(".") };
}
let played = false, dirty = false;
// 離開或切走網頁時，把最後的結果送一次（沒改過就不送）
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && dirty) {
    dirty = false;
    track("bingo_result", { ...resultParams(), transport_type: "beacon" });
    // 每個去過的景點各送一筆，之後用「人數」統計各景點有多少比例的人去過
    [...marked].filter((i) => i !== FREE).forEach((i) =>
      track("bingo_spot", { spot: SPOTS[i][0].replace("\n", ""), transport_type: "beacon" }));
  }
});

function toggle(i) {
  if (!played) { played = true; track("bingo_play"); }
  dirty = true;
  marked.has(i) ? marked.delete(i) : marked.add(i);
  localStorage.setItem(STORE_KEY, JSON.stringify([...marked].filter((x) => x !== FREE)));
  document.getElementById("grid").children[i].classList.toggle("on", marked.has(i));
  updateResult(true);
}

// 分數：景點分數加總 ＋ 每條線 LINE_BONUS ＋ 全部去過再加 FULL_BONUS
function scoreOf() {
  const spots = SPOTS.reduce((s, sp, i) => s + (i !== FREE && marked.has(i) ? sp[2] : 0), 0);
  const lines = bingoLines().length * LINE_BONUS;
  const full = visitedCount() === SPOTS.length - 1 ? FULL_BONUS : 0;
  return { spots, lines, full, total: spots + lines + full };
}

// 依總分給稱號（全部 24 個都去過才是最高級）
function levelOf(score, v) {
  if (v === 0) return { title: "還在做夢的旅人", emoji: "💭", desc: "先把機票訂起來吧！" };
  if (v === SPOTS.length - 1) return { title: `傳說中的${AREA}之神`, emoji: "👑", desc: "全部去過！你就是活地圖！" };
  if (score < 80) return { title: `${AREA}新手旅人`, emoji: "🌱", desc: "旅程才剛開始，下次多去幾個地方！" };
  if (score < 200) return { title: `${AREA}探索家`, emoji: "🎒", desc: "熱門景點都去過了，開始往深度玩！" };
  if (score < 400) return { title: `${AREA}旅遊達人`, emoji: "⭐", desc: "朋友去之前都會先來問你！" };
  if (score < 650) return { title: `${AREA}在地通`, emoji: "🏮", desc: "比當地人還熟，根本住在那裡！" };
  return { title: `${AREA}旅遊大師`, emoji: "🏆", desc: "只差一點點就全制霸了！" };
}
const currentLevel = () => levelOf(scoreOf().total, visitedCount());

function updateResult(animate) {
  const n = bingoLines().length;
  const v = visitedCount();
  const el = document.getElementById("result");
  const sc = scoreOf();
  const lv = levelOf(sc.total, v);
  const detail = `景點 ${sc.spots}` + (sc.lines ? ` ＋ 連線 ${n} 條 ${sc.lines}` : "") + (sc.full ? ` ＋ 全制霸 ${sc.full}` : "");
  el.innerHTML = v === 0 ? "點一下你去過的景點"
    : `<div class="level">${lv.emoji} ${lv.title}</div>`
      + `<div class="total">總分 <b>${sc.total}</b> 分</div>`
      + `<div class="detail">${detail}</div>`
      + `<div class="desc">去過 ${v} 個景點，連成 ${n} 條線・${lv.desc}</div>`;
  if (animate && n > lastLines) {
    const t = document.getElementById("toast");
    t.textContent = n >= 12 ? `全部連線！${AREA}達人 👑` : `BINGO ×${n}　+${LINE_BONUS} 分 🎉`;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1100);
  }
  lastLines = n;
}

document.getElementById("reset").onclick = () => {
  if (!confirm("確定要清除所有圈選嗎？")) return;
  marked = new Set([FREE]);
  localStorage.removeItem(STORE_KEY);
  lastLines = 0;
  document.getElementById("preview").style.display = "none";
  render();
};

// ====== 產生分享圖（1080×1350，跟 IG 貼文同尺寸） ======
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
const TITLE_FONT = '"Huninn","PingFang TC",sans-serif';
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function loadIcon() {
  return new Promise((ok) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = "coupon-icon.png"; });
}

function drawCard(icon) {
  const W = 1080, H = 1350, cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#fff7ee"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  // 標題（粉圓體）
  ctx.font = `400 104px ${TITLE_FONT}`;
  const t1 = AREA + "景點 ", t2 = "BINGO";
  const w1 = ctx.measureText(t1).width, w2 = ctx.measureText(t2).width, x0 = (W - w1 - w2) / 2;
  ctx.textAlign = "left"; ctx.fillStyle = "#2b2523"; ctx.fillText(t1, x0, 180);
  ctx.fillStyle = "#d9435a"; ctx.fillText(t2, x0 + w1, 180);
  ctx.textAlign = "center";
  // 成績
  const n = bingoLines().length, v = visitedCount(), sc = scoreOf();
  const lv = levelOf(sc.total, v);
  ctx.font = `400 50px ${TITLE_FONT}`; ctx.fillStyle = "#d9435a";
  ctx.fillText(`${lv.emoji} ${lv.title}｜${sc.total} 分`, W / 2, 268);
  ctx.font = `700 28px ${FONT}`; ctx.fillStyle = "#8a7f78";
  const detail = `景點 ${sc.spots}` + (sc.lines ? ` ＋ 連線 ${sc.lines}` : "") + (sc.full ? ` ＋ 全制霸 ${sc.full}` : "");
  ctx.fillText(`去過 ${v} 個景點、連成 ${n} 條線（${detail}）`, W / 2, 322, 980);

  // 格子
  const cell = 156, gap = 14, gx = (W - (cell * 5 + gap * 4)) / 2, gy = 356;
  const pos = (i) => ({ x: gx + (i % 5) * (cell + gap), y: gy + Math.floor(i / 5) * (cell + gap) });
  SPOTS.forEach(([name, region, pts], i) => {
    const { x, y } = pos(i);
    const free = i === FREE, on = marked.has(i) && !free;
    roundRect(ctx, x, y, cell, cell, 18);
    ctx.fillStyle = free ? "#2b2523" : on ? "#fff4f4" : "#ffffff"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = free ? "#2b2523" : "#efe2d4"; ctx.stroke();
    if (!free) { // 右上角的景點分數
      ctx.save(); ctx.textAlign = "right"; ctx.font = `800 20px ${FONT}`;
      ctx.fillStyle = on ? "#d9435a" : "#b5a99f"; ctx.fillText(`${pts}分`, x + cell - 12, y + 22); ctx.restore();
    }
    const lines = name.split("\n");
    const hasPill = !free, hasTop = free;
    const block = lines.length * 38 + (hasPill || hasTop ? 40 : 0);
    let cy = y + cell / 2 - block / 2;
    if (hasTop) { // 免費格上方的黃色標籤
      ctx.font = `800 22px ${FONT}`; const tw = ctx.measureText(ENTRY_TAG).width + 24;
      roundRect(ctx, x + cell / 2 - tw / 2, cy, tw, 32, 16); ctx.fillStyle = "#ffd54a"; ctx.fill();
      ctx.fillStyle = "#2b2523"; ctx.fillText(ENTRY_TAG, x + cell / 2, cy + 17); cy += 40;
    }
    ctx.font = `800 32px ${FONT}`; ctx.fillStyle = free ? "#ffffff" : "#2b2523";
    lines.forEach((l, k) => ctx.fillText(l, x + cell / 2, cy + 19 + k * 38));
    cy += lines.length * 38 + 6;
    if (hasPill) {
      ctx.font = `800 22px ${FONT}`; const pw = ctx.measureText(region).width + 24;
      roundRect(ctx, x + cell / 2 - pw / 2, cy, pw, 32, 16); ctx.fillStyle = REGIONS[region]; ctx.fill();
      ctx.fillStyle = "#ffffff"; ctx.fillText(region, x + cell / 2, cy + 17);
    }
    if (on) { // 手繪感的紅圈
      ctx.save(); ctx.translate(x + cell / 2, y + cell / 2); ctx.rotate(-0.14);
      ctx.beginPath(); ctx.ellipse(0, 0, cell * 0.52, cell * 0.47, 0, 0.2, Math.PI * 2 - 0.05);
      ctx.lineWidth = 7; ctx.lineCap = "round"; ctx.strokeStyle = "rgba(217,67,90,.9)"; ctx.stroke(); ctx.restore();
    }
  });
  // 連成的線
  ctx.lineCap = "round"; ctx.lineWidth = 14; ctx.strokeStyle = "rgba(217,67,90,.45)";
  bingoLines().forEach((l) => {
    const a = pos(l[0]), b = pos(l[4]);
    ctx.beginPath(); ctx.moveTo(a.x + cell / 2, a.y + cell / 2); ctx.lineTo(b.x + cell / 2, b.y + cell / 2); ctx.stroke();
  });

  // 圖例
  const items = Object.entries(REGIONS);
  ctx.font = `700 26px ${FONT}`;
  const widths = items.map(([nm]) => ctx.measureText(nm).width + 30);
  let lx = (W - widths.reduce((s, w) => s + w + 20, -20)) / 2;
  items.forEach(([nm, col], k) => {
    ctx.beginPath(); ctx.arc(lx + 9, 1215, 9, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
    ctx.textAlign = "left"; ctx.fillStyle = "#8a7f78"; ctx.fillText(nm, lx + 24, 1216); lx += widths[k] + 20;
  });

  // 頁尾
  ctx.textAlign = "left";
  if (icon) { ctx.save(); roundRect(ctx, gx, 1262, 52, 52, 12); ctx.clip(); ctx.drawImage(icon, gx, 1262, 52, 52); ctx.restore(); }
  ctx.font = `800 30px ${FONT}`; ctx.fillStyle = "#2b2523"; ctx.fillText("日本優惠券", gx + (icon ? 66 : 0), 1289);
  ctx.textAlign = "right"; ctx.font = `700 24px ${FONT}`; ctx.fillStyle = "#8a7f78";
  ctx.fillText("你也來玩 → " + SHARE_URL.replace(/^https?:\/\//, ""), W - gx, 1289);
  return cv;
}

function canvasToBlob(cv) {
  return new Promise((ok, bad) => { try { cv.toBlob((b) => (b ? ok(b) : bad(new Error("toBlob"))), "image/png"); } catch (e) { bad(e); } });
}

async function makeImage() {
  // 畫分享圖前先確定粉圓體載入好，不然圖上的標題會變成一般字體
  try { await document.fonts.load('104px "Huninn"', AREA + "景點BINGO｜分0123456789" + currentLevel().title); } catch {}
  try { return await canvasToBlob(drawCard(await loadIcon())); }
  catch { return await canvasToBlob(drawCard(null)); } // 本機直接開檔時，圖示可能讓畫布無法匯出，改成不放圖示
}

// 下載：手機（含 Threads、IG 的內建瀏覽器）沒辦法可靠地直接存檔，
// 所以手機改成跳出大圖，請使用者「長按 → 加入照片」；電腦則直接下載 PNG
const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
const blobToDataURL = (blob) => new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(blob); });
async function downloadImage(blob) {
  if (IS_MOBILE) {
    document.getElementById("saveImg").src = await blobToDataURL(blob);  // 用 data URL，內建瀏覽器長按也能存
    document.getElementById("saveModal").classList.add("show");
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = `${SLUG}-bingo.png`;
  document.body.append(a); a.click(); a.remove();
  document.getElementById("previewImg").src = url;
  document.getElementById("preview").style.display = "block";
}
document.getElementById("saveClose").onclick = () => document.getElementById("saveModal").classList.remove("show");
document.getElementById("saveModal").onclick = (e) => { if (e.target.id === "saveModal") e.target.classList.remove("show"); };

document.getElementById("share").onclick = async () => {
  track("bingo_share", { method: "share", ...resultParams() });
  const blob = await makeImage();
  const file = new File([blob], `${SLUG}-bingo.png`, { type: "image/png" });
  const text = `我是「${currentLevel().title}」，拿到 ${scoreOf().total} 分！去過 ${visitedCount()} 個${AREA}景點、連成 ${bingoLines().length} 條線，你幾分？ ${SHARE_URL}`;
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], text }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  downloadImage(blob); // 不支援直接分享的瀏覽器，改成下載
};

document.getElementById("download").onclick = async () => {
  track("bingo_share", { method: "download", ...resultParams() });
  downloadImage(await makeImage());
};
// 點底部的 App 宣傳圖
document.querySelectorAll(".promo a").forEach((a) => a.addEventListener("click", () =>
  track("bingo_app_click", { app: a.href.includes("/jscan/") ? "jscan" : "coupon" })));

render();
</script>
</body>
</html>
