<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />

  <script>
  /* 這裡「只做判斷，不做轉址」。
     重要：在 <head> 呼叫 location.replace() 會讓瀏覽器停止解析這份文件，
     而 IG / LINE 等 in-app webview 又常把該次跳轉擋掉，
     結果就是 body 還沒渲染就卡住 → 使用者看到全白畫面。
     所以真正的轉址移到 </body> 前，等畫面畫完才執行。 */
  (function () {
    var ua = navigator.userAgent || '';
    var isAndroid = /android/i.test(ua);
    var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

    // LINE / IG / FB / Threads 等 App 的內建瀏覽器
    var inApp = /FBAN|FBAV|FB_IAB|Instagram|Threads|Barcelona|Line\/|Messenger|MicroMessenger|KAKAOTALK|Twitter/i.test(ua);

    window.JSCAN = {
      // Android 進 Play，iOS 與電腦版都進 App Store
      target: isAndroid
        ? 'https://play.google.com/store/apps/details?id=com.junlando.japanmenu'
        : 'https://apps.apple.com/tw/app/id6742044545',
      isAndroid: isAndroid,
      isIOS: isIOS,
      inApp: inApp,
      // iOS 的 in-app webview 會擋掉非使用者點擊的跳轉，硬跳只會換來白畫面
      blocked: inApp && !isAndroid,
      redirected: false
    };
  })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>下載 JScan 日文翻譯 App｜Junlando</title>
  <meta name="description" content="JScan 日文菜單・藥妝商品 AI 即時翻譯 App，免費下載。iOS 與 Android 皆支援。" />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/jpeg" href="/jscan/app_icon.jpg" />
  <link rel="canonical" href="https://junlando.com/jscan/download/" />

  <!-- OG tags（LINE / FB 分享預覽） -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://junlando.com/jscan/download/" />
  <meta property="og:title" content="JScan｜日文菜單・藥妝 AI 即時翻譯" />
  <meta property="og:description" content="拍照就能看懂日文，日本旅遊吃得安心、買得放心。免費下載。" />
  <meta property="og:image" content="https://junlando.com/jscan/app_icon.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    :root {
      --ink: #111827;
      --ink-soft: #4b5563;
      --accent: #b91c1c;
      --border: #e5e7eb;
      --bg: #fff;
      --bg-muted: #f9fafb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans JP", "Microsoft JhengHei", "Hiragino Kaku Gothic ProN", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .card { width: 100%; max-width: 420px; text-align: center; }
    .app-icon {
      width: 96px; height: 96px;
      border-radius: 22px;
      box-shadow: 0 6px 20px rgba(0,0,0,.12);
      margin-bottom: 20px;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .subtitle { color: var(--ink-soft); font-size: 15px; margin-bottom: 28px; }
    .status {
      font-size: 14px;
      color: var(--ink-soft);
      background: var(--bg-muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 20px;
    }
    .status-alert {
      background: #fef2f2;
      border-color: #fecaca;
      color: var(--accent);
      font-weight: 600;
    }
    .buttons { display: flex; flex-direction: column; gap: 12px; }
    .store-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border: 1px solid var(--ink);
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity .2s;
    }
    .store-button.secondary { background: #fff; color: var(--ink); }
    .store-button:hover { opacity: .85; }
    .store-button svg { width: 22px; height: 22px; flex: none; }
    footer {
      margin-top: 32px;
      font-size: 13px;
      color: var(--ink-soft);
    }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <img class="app-icon" src="/jscan/app_icon.jpg" alt="JScan" />
    <h1>日文菜單 / 藥妝商品翻譯</h1>
    <p class="subtitle">AI 拍照即時翻譯，日本旅遊必備</p>

    <p class="status" id="status">請點下方按鈕下載 JScan。</p>

    <div class="buttons">
      <a class="store-button" id="btn-ios"
         href="https://apps.apple.com/tw/app/id6742044545"
         rel="noopener">
        <svg viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
        <span>從 App Store 下載</span>
      </a>
      <a class="store-button secondary" id="btn-android"
         href="https://play.google.com/store/apps/details?id=com.junlando.japanmenu"
         rel="noopener">
        <svg viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg>
        <span>從 Google Play 下載</span>
      </a>
    </div>

    <footer>
      <p><a href="/jscan/">了解更多 JScan</a></p>
      <p style="margin-top:8px;">© 2025 Junlando</p>
    </footer>
  </div>

  <script>
  (function () {
    var cfg = window.JSCAN || { isAndroid: false, blocked: true, target: '' };

    /* 第一步：把畫面整理好。整段包 try/catch，
       任何錯誤都不能影響使用者手動點按鈕。 */
    try {
      var primary = document.getElementById(cfg.isAndroid ? 'btn-android' : 'btn-ios');
      var secondary = document.getElementById(cfg.isAndroid ? 'btn-ios' : 'btn-android');
      primary.classList.remove('secondary');
      secondary.classList.add('secondary');
      document.querySelector('.buttons').prepend(primary);
    } catch (e) {}

    /* 第二步：判斷要不要自動轉址。
       in-app 瀏覽器（iOS）不自動跳 —— 跳了會被擋，還可能整頁變白。
       讓使用者點按鈕，那是「使用者手勢」，webview 才會放行。 */
    if (cfg.blocked) {
      try {
        var el = document.getElementById('status');
        el.textContent = 'App 內建瀏覽器無法自動開啟，請點下方按鈕下載 👇';
        el.classList.add('status-alert');
      } catch (e) {}
      return;
    }

    // 使用者從商店按「上一頁」回來時不要再被彈走
    var seen = false;
    try { seen = sessionStorage.getItem('jscan_redirected') === '1'; } catch (e) {}
    if (seen) return;
    try { sessionStorage.setItem('jscan_redirected', '1'); } catch (e) {}

    try {
      document.getElementById('status').textContent =
        '正在開啟 ' + (cfg.isAndroid ? 'Google Play' : 'App Store') + '…若沒有自動跳轉，請點下方按鈕。';
    } catch (e) {}

    /* 此時 DOM 已經完整渲染，就算這次跳轉被擋掉，
       使用者看到的也是完整的下載頁，不會是白畫面。
       用 replace 避免按「上一頁」時來回彈。 */
    window.location.replace(cfg.target);
  })();
  </script>
</body>
</html>
